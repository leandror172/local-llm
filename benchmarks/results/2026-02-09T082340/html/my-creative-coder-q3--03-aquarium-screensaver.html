<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aquarium Screensaver</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="aquarium"></canvas>
<script>
const canvas = document.getElementById('aquarium');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Gradient background
function drawBackground() {
  const gradient = ctx.createLinearGradient(0, height, 0, 0);
  gradient.addColorStop(0, '#000044');
  gradient.addColorStop(1, '#000088');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  
  // Sandy bottom
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(0, height - 50, width, 50);
  
  // Pebbles
  ctx.fillStyle = '#A0522D';
  for (let i = 0; i < 50; i++) {
    ctx.beginPath();
    ctx.arc(Math.random() * width, height - 30 + Math.random() * 20, 2 + Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Light rays
function drawLightRays() {
  ctx.strokeStyle = 'rgba(255, 255, 25, 0.2)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const x = width / 2 + Math.cos(angle) * 100;
    const y = height / 2 + Math.sin(angle) * 100;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * 50, y + Math.sin(angle) * 50);
    ctx.stroke();
  }
}

// Plant class
class Plant {
  constructor() {
    this.x = Math.random() * (width - 20) + 10;
    this.y = height - 40;
    this.amplitude = Math.random() * 10 + 5;
    this.time = 0;
  }
  
  update() {
    this.time += 0.01;
  }
  
  draw() {
    ctx.fillStyle = '#228B22';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - 5, this.y + 10);
    ctx.lineTo(this.x + 5, this.y + 10);
    ctx.closePath();
    ctx.fill();
    
    // Sway animation
    const sway = Math.sin(this.time) * this.amplitude;
    ctx.beginPath();
    ctx.arc(this.x + sway, this.y - 15, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Bubble class
class Bubble {
  constructor() {
    this.x = Math.random() * width;
    this.y = height - 20;
    this.radius = 5;
    this.speed = 1 + Math.random() * 2;
    this.growth = 0.1 + Math.random() * 0.3;
  }
  
  update() {
    this.y -= this.speed;
    this.radius += this.growth;
    if (this.y < 0) {
      return false;
    }
    return true;
  }
  
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fill();
  }
}

// Fish class
class Fish {
  constructor() {
    this.size = 15 + Math.random() * 10;
    this.x = Math.random() * width;
    this.y = height - 100;
    this.vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);
    this.vy = -Math.random() * 1;
    this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
    this.direction = this.vx > 0 ? 1 : -1;
    this.tailAngle = 0;
  }
  
  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    // Bounce off walls
    if (this.x < 0 || this.x > width) {
      this.vx *= -1;
      this.vy = -Math.random() * 1;
    }
    
    // Bounce off top
    if (this.y < 0) {
      this.y = height;
      this.x = Math.random() * width;
      this.vy = -Math.random() * 1;
    }
    
    // Update tail angle
    this.tailAngle += this.vx * 0.1;
  }
  
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = this.color;
    
    // Body
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-this.size/2, -this.size/2);
    ctx.lineTo(this.size/2, -this.size/2);
    ctx.closePath();
    ctx.fill();
    
    // Tail fin
    ctx.save();
    ctx.translate(0, -this.size/2);
    ctx.rotate(this.tailAngle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-this.size/4, -this.size/4);
    ctx.lineTo(this.size/4, -this.size/4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    
    // Eye
    ctx.beginPath();
    ctx.arc(-this.size/4, -this.size/2, this.size/6, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.restore();
  }
}

let plants = [];
let bubbles = [];
let fish = [];

// Initialize elements
for (let i = 0; i < 10; i++) {
  plants.push(new Plant());
}

for (let i = 0; i < 8; i++) {
  fish.push(new Fish());
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  drawBackground();
  
  // Update and draw plants
  for (let plant of plants) {
    plant.update();
    plant.draw();
  }
  
  // Update and draw bubbles
  for (let i = bubbles.length - 1; i >= 0; i--) {
    if (!bubbles[i].update()) {
      bubbles.splice(i, 1);
    } else {
      bubbles[i].draw();
    }
  }
  
  // Spawn new bubbles
  if (Math.random() < 0.02) {
    bubbles.push(new Bubble());
  }
  
  // Update and draw fish
  for (let fish of fish) {
    fish.update();
    fish.draw();
  }
  
  // Draw light rays
  drawLightRays();
  
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
