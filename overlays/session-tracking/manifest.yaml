name: session-tracking
version: 11
description: >
  Session continuity tools for Claude Code projects. Installs resume.sh
  (session-start summary) and rotate-session-log.sh (log archival). Installs
  the session-handoff skill and run-handoff shim at user level by default
  (--install-level project for per-repo). Creates starter templates for
  session-log.md, session-context.md, and tasks.md. Injects session workflow
  rules into CLAUDE.md.
  Since v11 the pipeline itself is NOT installed by this overlay: it is the
  `session-tracking` Python package (see pyproject.toml). This overlay installs
  config and docs only.
  The package requires PyYAML — only register/registry_io.py imports it; the
  safety core (register/locator.py, handoff/applier.py, handoff/verifier.py)
  is stdlib-only.
  v7: append↔checkoff consistency fix + failure-clarity sweep (where/whose/what + kind).
  v8: harvest boundary tightened to 'chore(session-handoff): session ' (T-59) — avoids
  false boundaries from bare chore(session-handoff): prefix reuse.
  v9: handoff-tooling bug sweep — T-78 wrapped-bullet parser continuation-join
  (payload.py); T-62 run-handoff shim honors --registry + prefers a co-located
  engine over the user-level install; T-61 resume.sh reading-guide backported so
  overlay source ⊇ installed.
  v10: T-61 general customization seam — resume.sh moved files: -> customizable:
  with an overlay-keep:reading-guide region a repo may customize (career-search's
  title/filter variant) while still receiving every other resume.sh update.
  v11: R-D9 packaging flip — the pipeline modules are no longer copied per machine.
  Code ships as the `session-tracking` Python package (src/sessiontracking, console
  entry point `st-handoff`); this overlay now installs CONFIG and DOCS only. Install
  the engine with `uv tool install --editable overlays/session-tracking`. The shim
  resolves st-handoff -> source tree -> legacy ~/.claude/tools/handoff (transitional).

# Copied verbatim to target repo. Backed up if dest differs.
files:
  rotate-session-log.sh: .claude/tools/rotate-session-log.sh
  handoff-harvest.sh: .claude/tools/handoff-harvest.sh
  # v11 (R-D5): resume.sh is a thin shim again — overlay-owned, no keep-region. What it
  # prints is per-repo CONFIG in .claude/resume.yaml, so a repo customizes data, not code.
  # The `customizable:` CATEGORY stays in the installer (T-61) — it is the general escape
  # hatch for files with no config layer. This was its only consumer; zero call-sites is
  # the healthy steady state for an escape hatch.
  resume.sh: .claude/tools/resume.sh

# NOTE (v11, R-D9): `always_user_files:` is GONE. It copied ten .py modules into
# ~/.claude/tools/handoff/ — a hand-rolled package manager. The engine is now the
# `session-tracking` Python package:
#
#     uv tool install --editable overlays/session-tracking
#
# Code ships as a package; config ships as an overlay. Everything below is per-repo
# config or docs, which no package manager should own.

# Installed to ~/.claude/ (user) or .claude/ (project) per --install-level.
# Default: user. Use --install-level project for a self-contained repo install.
user_files:
  handoff/run-handoff.sh: tools/handoff/run-handoff.sh
  session-handoff/SKILL.md: skills/session-handoff/SKILL.md

# Created from template only if dest does not exist. Never overwrites.
templates:
  session-log.md.tmpl: .claude/session-log.md
  session-context.md.tmpl: .claude/session-context.md
  tasks.md.tmpl: .claude/tasks.md

# The handoff register is load-bearing AND per-repo: its locators point at this
# repo's tracking-file anchors. First install copies it; on later installs the
# installer FLAGS it for manual merge instead of silently overwriting (files:)
# or silently skipping (templates:) — so register fixes propagate with awareness.
# Source resolves to files/registry.yaml (installer uses files_dir / basename).
manual_if_exists:
  - .claude/handoff/registry.yaml
  # resume.yaml is the step list `st-resume` renders (v11, R-D1/R-D2). Pure per-repo
  # config with no code beside it: a repo reorders/retitles/filters its own sections
  # here rather than patching resume.sh. Same category as the register — copy once,
  # then flag rather than clobber. Safe to add now that T-54 makes the flag discriminate
  # (an identical file records SAME, not TODO).
  - .claude/resume.yaml

# Section injected into CLAUDE.md using overlay markers.
merge_sections:
  CLAUDE.md:
    file: sections/claude-md-session-rules.md
    merge_hint: "insert near the top of the file, after any ref-indexing overlay section if present, before project-specific rules"

agent_targets:
  claude-code:
    tools_dir: .claude/tools
    rules_file: CLAUDE.md
