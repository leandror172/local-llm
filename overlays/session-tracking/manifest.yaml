name: session-tracking
version: 5
description: >
  Session continuity tools for Claude Code projects. Installs resume.sh
  (session-start summary) and rotate-session-log.sh (log archival). Installs
  the session-handoff skill at user level by default (--skill-level project for
  per-repo). Creates starter templates for session-log.md, session-context.md,
  and tasks.md. Injects session workflow rules into CLAUDE.md.
  The deterministic handoff pipeline (.claude/tools/handoff/) requires PyYAML
  (pip install pyyaml) — only registry_io.py imports it; the safety core is
  stdlib-only.

# Copied verbatim to target repo. Backed up if dest differs.
files:
  resume.sh: .claude/tools/resume.sh
  rotate-session-log.sh: .claude/tools/rotate-session-log.sh
  handoff-harvest.sh: .claude/tools/handoff-harvest.sh
  # Session-handoff pipeline — register-driven deterministic transaction.
  # Runtime modules only; test_*.py are dev artifacts and are not shipped.
  handoff/locator.py: .claude/tools/handoff/locator.py
  handoff/applier.py: .claude/tools/handoff/applier.py
  handoff/verifier.py: .claude/tools/handoff/verifier.py
  handoff/mechanics.py: .claude/tools/handoff/mechanics.py
  handoff/runlog.py: .claude/tools/handoff/runlog.py
  handoff/gitio.py: .claude/tools/handoff/gitio.py
  handoff/orchestrator.py: .claude/tools/handoff/orchestrator.py
  handoff/payload.py: .claude/tools/handoff/payload.py
  handoff/registry_io.py: .claude/tools/handoff/registry_io.py
  handoff/handoff.py: .claude/tools/handoff/handoff.py
  handoff/run-handoff.sh: .claude/tools/handoff/run-handoff.sh

# Installed to ~/.claude/ by default (--skill-level user).
# Use --skill-level project to install per-repo instead.
# Skipped if already present at the target level (idempotent).
user_files:
  session-handoff/SKILL.md: skills/session-handoff/SKILL.md

# Created from template only if dest does not exist. Never overwrites.
templates:
  session-log.md.tmpl: .claude/session-log.md
  session-context.md.tmpl: .claude/session-context.md
  tasks.md.tmpl: .claude/tasks.md

# The handoff register is load-bearing AND per-repo: its locators point at this
# repo's tracking-file anchors. First install copies it; on later installs the
# installer FLAGS it for manual merge instead of silently overwriting (files:)
# or silently skipping (templates:) — so register fixes propagate with awareness.
# Source resolves to files/registry.yaml (installer uses files_dir / basename).
manual_if_exists:
  - .claude/handoff/registry.yaml

# Section injected into CLAUDE.md using overlay markers.
merge_sections:
  CLAUDE.md:
    file: sections/claude-md-session-rules.md
    merge_hint: "insert near the top of the file, after any ref-indexing overlay section if present, before project-specific rules"

agent_targets:
  claude-code:
    tools_dir: .claude/tools
    rules_file: CLAUDE.md
