name: session-tracking
version: 9
description: >
  Session continuity tools for Claude Code projects. Installs resume.sh
  (session-start summary) and rotate-session-log.sh (log archival). Installs
  the session-handoff skill and run-handoff shim at user level by default
  (--install-level project for per-repo). Pipeline modules always go to
  ~/.claude/tools/handoff/ regardless of --install-level. Creates starter
  templates for session-log.md, session-context.md, and tasks.md. Injects
  session workflow rules into CLAUDE.md.
  The deterministic handoff pipeline requires PyYAML (pip install pyyaml) —
  only registry_io.py imports it; the safety core is stdlib-only.
  v7: append↔checkoff consistency fix + failure-clarity sweep (where/whose/what + kind).
  v8: harvest boundary tightened to 'chore(session-handoff): session ' (T-59) — avoids
  false boundaries from bare chore(session-handoff): prefix reuse.
  v9: handoff-tooling bug sweep — T-78 wrapped-bullet parser continuation-join
  (payload.py); T-62 run-handoff shim honors --registry + prefers a co-located
  engine over the user-level install; T-61 resume.sh reading-guide backported so
  overlay source ⊇ installed.

# Copied verbatim to target repo. Backed up if dest differs.
files:
  resume.sh: .claude/tools/resume.sh
  rotate-session-log.sh: .claude/tools/rotate-session-log.sh
  handoff-harvest.sh: .claude/tools/handoff-harvest.sh

# Always installed to ~/.claude/tools/handoff/ — shared across all repos.
# Pipeline modules: never per-repo, never controlled by --install-level.
# Runtime modules only; test_*.py are dev artifacts and are not shipped.
always_user_files:
  handoff/locator.py: tools/handoff/locator.py
  handoff/applier.py: tools/handoff/applier.py
  handoff/verifier.py: tools/handoff/verifier.py
  handoff/mechanics.py: tools/handoff/mechanics.py
  handoff/runlog.py: tools/handoff/runlog.py
  handoff/gitio.py: tools/handoff/gitio.py
  handoff/orchestrator.py: tools/handoff/orchestrator.py
  handoff/payload.py: tools/handoff/payload.py
  handoff/registry_io.py: tools/handoff/registry_io.py
  handoff/handoff.py: tools/handoff/handoff.py

# Installed to ~/.claude/ (user) or .claude/ (project) per --install-level.
# Default: user. Use --install-level project for a self-contained repo install.
user_files:
  handoff/run-handoff.sh: tools/handoff/run-handoff.sh
  session-handoff/SKILL.md: skills/session-handoff/SKILL.md

# Created from template only if dest does not exist. Never overwrites.
templates:
  session-log.md.tmpl: .claude/session-log.md
  session-context.md.tmpl: .claude/session-context.md
  tasks.md.tmpl: .claude/tasks.md

# The handoff register is load-bearing AND per-repo: its locators point at this
# repo's tracking-file anchors. First install copies it; on later installs the
# installer FLAGS it for manual merge instead of silently overwriting (files:)
# or silently skipping (templates:) — so register fixes propagate with awareness.
# Source resolves to files/registry.yaml (installer uses files_dir / basename).
manual_if_exists:
  - .claude/handoff/registry.yaml

# Section injected into CLAUDE.md using overlay markers.
merge_sections:
  CLAUDE.md:
    file: sections/claude-md-session-rules.md
    merge_hint: "insert near the top of the file, after any ref-indexing overlay section if present, before project-specific rules"

agent_targets:
  claude-code:
    tools_dir: .claude/tools
    rules_file: CLAUDE.md
