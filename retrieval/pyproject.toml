[project]
name = "retrieval"
version = "0.1.0"
description = "LTG retrieval pipeline — embed, store, query, anchor, inspect"
authors = [
    { name = "Leandro Rocha", email = "leandrocdarocha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "lancedb>=0.17.0",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["..", "."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
