# LTG retrieval — model client config.
#
# Two-level shape: named model configs under `models:`, role references under `roles:`.
# load_config() resolves roles → full model config dicts at load time.
#
# Naming convention: {provider}-{model-slug}-{differentiating-params}
# Full design: docs/ideas/ltg-model-registry-design.md

models:
  ollama-qwen3-embedding-8b-dim-4096:
    provider: ollama
    model: qwen3-embedding:8b
    address: http://localhost:11434
    embed_dim: 4096

  ollama-qwen3-14b-no-think:
    provider: ollama
    model: qwen3:14b
    address: http://localhost:11434
    think: false                   # top-level payload key (NOT inside options{})
    timeout_s: 600
    options:
      num_ctx: 32768
      temperature: 0.1

  ollama-qwen25coder-14b:
    provider: ollama
    model: qwen2.5-coder:14b
    address: http://localhost:11434
    timeout_s: 600
    options:
      num_ctx: 32768
      temperature: 0.1

roles:
  embedding: ollama-qwen3-embedding-8b-dim-4096
  extraction_prose: ollama-qwen3-14b-no-think
  extraction_code: ollama-qwen25coder-14b

# Phase 4 graph build (ref:ltg-phase4-plan). tau_floor/top_k provisional until
# the Step-0 degree probe freezes them (probes/phase4-degree-probe.md).
graph:
  tau_floor: 0.70      # similarity-edge floor
  top_k: 10            # per-node kNN cap (union semantics)
  resolutions:
    coarse: 0.5        # leiden RBConfiguration resolution_parameter
    fine: 1.5
  seed: 42             # leiden RNG seed — reproducible partitions
